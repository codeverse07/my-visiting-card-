<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06131b">
<meta name="description" content="Digital business card of Sachin Kumar Jha, Software Developer. Connect on WhatsApp, LinkedIn, phone or email.">
<title>Sachin Kumar Jha | Digital Card</title>
<style>
:root{color-scheme:dark;--bg:#030b11;--panel:rgba(7,23,33,.84);--ink:#f5fbff;--muted:#a7bac5;--green:#71f000;--cyan:#00c8ff;--line:rgba(157,210,231,.22);--glass:rgba(255,255,255,.075)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100svh;padding:26px 14px 34px;display:grid;place-items:center;background:radial-gradient(ellipse at 8% 12%,rgba(87,255,0,.16),transparent 30%),radial-gradient(ellipse at 94% 25%,rgba(0,183,255,.19),transparent 32%),radial-gradient(ellipse at 55% 100%,rgba(0,255,157,.10),transparent 35%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1;opacity:.42}
body:before{inset:0;background-image:linear-gradient(rgba(0,200,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.035) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
body:after{width:390px;height:390px;border:1px solid rgba(0,200,255,.18);border-radius:50%;right:-240px;top:20%;box-shadow:0 0 0 24px rgba(0,200,255,.025),0 0 0 55px rgba(0,200,255,.02)}
.card{position:relative;width:min(100%,490px);overflow:hidden;border:1px solid rgba(128,225,255,.44);border-radius:30px;background:linear-gradient(145deg,rgba(10,31,43,.96),rgba(3,14,22,.96) 58%,rgba(4,25,29,.97));box-shadow:0 0 0 1px rgba(112,240,0,.10),0 24px 80px rgba(0,0,0,.55),0 0 48px rgba(0,178,255,.13),inset 0 1px 0 rgba(255,255,255,.12)}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 12%,rgba(113,240,0,.06) 12.2%,transparent 13%),linear-gradient(295deg,transparent 82%,rgba(0,200,255,.07) 82.2%,transparent 83%);z-index:0}
.card>*{position:relative;z-index:1}
.hero{padding:30px 22px 25px;text-align:center;background:linear-gradient(180deg,rgba(5,18,27,.4),rgba(5,18,27,.05));border-bottom:1px solid var(--line)}
.brand-logo{width:min(220px,68%);height:auto;max-height:132px;object-fit:contain;filter:drop-shadow(0 0 13px rgba(113,240,0,.25)) drop-shadow(0 0 15px rgba(0,200,255,.15))}
.eyebrow{margin:9px 0 0;color:#d9e8ef;font-size:11px;font-weight:700;letter-spacing:.34em;text-transform:uppercase}
.eyebrow span{color:var(--green)}
.rule{height:2px;width:min(270px,80%);margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--green),#d6fff2,var(--cyan),transparent);box-shadow:0 0 12px rgba(0,255,172,.6)}
.profile{padding:24px 22px 4px;text-align:center}
.avatar{width:104px;height:104px;margin:0 auto 14px;display:grid;place-items:center;border-radius:50%;font-size:36px;font-weight:800;letter-spacing:-2px;color:#fff;background:radial-gradient(circle at 32% 24%,#193a3e,#07131c 68%);border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 0 2px var(--green),0 0 0 5px rgba(0,200,255,.8),0 0 30px rgba(0,221,185,.25)}
h1{margin:0;font-size:clamp(25px,6vw,34px);line-height:1.16;letter-spacing:-.04em}
.role{margin:8px 0 0;color:var(--green);font-size:16px;font-weight:750;letter-spacing:.02em}
.links{display:grid;gap:11px;padding:22px 22px 10px}
.action{min-height:64px;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:17px;text-decoration:none;color:#f7fbff;font-size:15px;font-weight:700;letter-spacing:.005em;border:1px solid rgba(185,222,236,.28);background:linear-gradient(110deg,rgba(255,255,255,.12),rgba(255,255,255,.045));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 7px 22px rgba(0,0,0,.16);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.action:hover{transform:translateY(-2px);border-color:rgba(0,200,255,.72);box-shadow:0 0 22px rgba(0,200,255,.15),inset 0 1px 0 rgba(255,255,255,.18)}
.action:focus-visible,.save:focus-visible{outline:3px solid #fff;outline-offset:3px}
.action .ico{width:39px;height:39px;flex:none;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.1);font-size:21px}
.action .label{flex:1;min-width:0;overflow-wrap:anywhere}
.action .arrow{font-size:22px;color:#b7d5e2}
.whatsapp{border-color:rgba(113,240,0,.48);background:linear-gradient(100deg,rgba(37,211,102,.18),rgba(255,255,255,.045) 48%,rgba(0,200,255,.09))}
.whatsapp .ico{background:rgba(37,211,102,.18)}
.linkedin{border-color:rgba(0,153,255,.48);background:linear-gradient(100deg,rgba(10,102,194,.24),rgba(255,255,255,.045))}
.linkedin .ico{background:rgba(10,102,194,.25)}
.section{padding:23px 22px 26px}
.section-title{display:flex;align-items:center;gap:12px;margin:0 0 16px;color:#c5d5de;font-size:12px;font-weight:800;letter-spacing:.32em;text-transform:uppercase}
.section-title:before,.section-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(0,200,255,.65))}
.section-title:after{background:linear-gradient(90deg,rgba(113,240,0,.65),transparent)}
.skills{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}
.skill{min-width:88px;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 13px;border:1px solid rgba(160,204,220,.22);border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035));color:#e8f5fa;font-size:13px;font-weight:650;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.skill b{font-size:17px}
.footer{padding:14px 20px 20px;text-align:center;border-top:1px solid rgba(150,210,228,.13);color:#829ba8;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.footer span{color:var(--green)}
.save-wrap{padding:0 22px 22px}
.save{width:100%;padding:13px 16px;border:1px solid rgba(113,240,0,.55);border-radius:14px;background:linear-gradient(100deg,rgba(113,240,0,.17),rgba(0,200,255,.12));color:#eaffdf;font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;letter-spacing:.03em;box-shadow:0 0 22px rgba(113,240,0,.08);transition:filter .2s,transform .2s}
.save:hover{filter:brightness(1.18);transform:translateY(-1px)}
@media(max-width:380px){body{padding:12px 9px}.hero{padding:24px 16px 21px}.profile{padding-inline:16px}.links,.section,.save-wrap{padding-left:16px;padding-right:16px}.action{padding:10px 12px;font-size:14px}.brand-logo{width:68%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
